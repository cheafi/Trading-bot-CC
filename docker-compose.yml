# TradingAI Bot — unattended trading base stack
#
# Quick start (paper, infrastructure only):
#   cp .env.example .env   # set POSTGRES_PASSWORD, TWS_USERID/TWS_PASSWORD
#   docker compose up -d postgres ib-gateway reconciler
#
# With venue orchestrators (copy override example first):
#   cp docker-compose.override.yml.example docker-compose.override.yml
#   docker compose up -d --build
#
# Dev CC dashboard (separate file — no orchestrators):
#   docker compose -f docker-compose.dev.yml up --build
#
# Legacy full ingestor/signal/monitoring stack:
#   docker compose -f docker-compose.stack.yml up -d
#
# Profiles:
#   --profile dev     Jupyter + pgAdmin (local research)
#   --profile ai        LLM sidecar hooks (extend in override)
#   --profile ops       db-backup + Watchtower stubs
#   --profile research  nightly walk-forward container (CPU/RAM capped)

name: tradingai

x-state-volume: &state-volume
  - state_data:/app/data/state

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-tradingai}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
  POSTGRES_DB: ${POSTGRES_DB:-tradingai}

services:
  # ── Broker gateways (localhost bind only) ─────────────────────────────────

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: tradingai_ib_gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:?Set TWS_USERID in .env}
      TWS_PASSWORD: ${TWS_PASSWORD:?Set TWS_PASSWORD in .env}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_2FA_TIMEOUT:-yes}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      TZ: ${TIME_ZONE:-America/New_York}
    ports:
      # Paper 4002 / live 4003 — orchestrators set IB_API_PORT to match TRADING_MODE
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:4003:4003"
    networks:
      - trading_network

  futu-opend:
    build:
      context: .
      dockerfile: docker/Dockerfile.futu-opend
    container_name: tradingai_futu_opend
    restart: unless-stopped
    ports:
      - "127.0.0.1:11111:11111"
    volumes:
      # Mount official OpenD bundle from host (not redistributable)
      - ${FUTU_OPEND_HOST_PATH:-./docker/futu-opend}:/opt/futu-opend:ro
    networks:
      - trading_network

  # ── State + persistence ───────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: tradingai_postgres
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradingai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # ── Reconciler — broker vs DB every 5 min, halt on mismatch ───────────────

  reconciler:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    container_name: tradingai_reconciler
    restart: unless-stopped
    command: ["python", "scripts/reconciler_loop.py"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - STATE_DATA_DIR=/app/data/state
      - RECONCILE_INTERVAL_SECONDS=300
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *state-volume
    networks:
      - trading_network

  # ── Nightly research (walk-forward / DSR) — stub ──────────────────────────

  research:
    profiles: ["research"]
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    container_name: tradingai_research
    restart: unless-stopped
    command: ["python", "scripts/research_nightly_stub.py"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - STATE_DATA_DIR=/app/data/state
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    volumes: *state-volume
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - trading_network

  # ── Ops stubs: daily DB dump + Monday image updates ───────────────────────

  db-backup:
    profiles: ["ops"]
    image: postgres:15-alpine
    container_name: tradingai_db_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "db-backup stub — wire pg_dump cron to /backups on VPS"
        while true; do sleep 86400; done
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tradingai}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tradingai}
    volumes:
      - state_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network

  watchtower:
    profiles: ["ops"]
    image: containrrr/watchtower:latest
    container_name: tradingai_watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * 1
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Dev profile tools ─────────────────────────────────────────────────────

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: tradingai_jupyter
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env for profile dev}
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./src:/home/jovyan/src:ro
      - state_data:/home/jovyan/data/state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradingai_pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@local.dev}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres
    networks:
      - trading_network

volumes:
  state_data:
    name: tradingai_state_data
  postgres_data:
    name: tradingai_postgres_data

networks:
  trading_network:
    driver: bridge
