    <!-- ══════ INSTANT DEGRADED BANNER (under nav — dismissible) ══════ -->
    <div data-cc="instant-degraded-banner" x-show="instantDegradedBannerVisible()" x-cloak style="background:linear-gradient(90deg,#422006,#1c1917);border-bottom:1px solid #b45309;padding:7px 12px;display:flex;align-items:flex-start;gap:8px">
      <span style="padding:3px 8px;border-radius:4px;font-weight:800;font-size:10px;letter-spacing:.5px;background:#7f1d1d;color:#fde68a;border:1px solid #ef4444;flex-shrink:0">INSTANT DEGRADED</span>
      <div style="flex:1;min-width:0">
        <div class="text-[10px] font-bold" style="color:#fde68a" x-text="instantDegradedBannerLine()"></div>
        <div class="text-[8px] mt-1" style="color:var(--t2)" x-text="instantDegradedBannerHint()"></div>
      </div>
      <button type="button" @click="dismissInstantDegradedBanner()" class="btn-s text-[9px] flex-shrink:0" style="color:#fde68a;border-color:rgba(251,191,36,.4)">Dismiss</button>
    </div>

    <div data-cc="warmup-context-strip" x-show="warmupContextStripVisible()" x-cloak
      style="background:var(--s0);border-bottom:1px solid var(--bd);padding:4px 12px;font-size:9px;line-height:1.4;color:var(--t2);display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span x-show="warmupStatusLine()" class="font-bold" style="color:var(--amber)" x-text="warmupStatusLine()"></span>
      <span x-show="warmupStatusLine()&&warmupUpgradeQueue()" class="mx-1" style="color:var(--t3)">·</span>
      <span x-show="warmupUpgradeQueue()" x-text="warmupUpgradeQueue()"></span>
      <span x-show="loadingSessionRecoveryLine()" class="pill pw text-[7px]" x-text="loadingSessionRecoveryLine()"></span>
      <span x-show="operatorLoadingSafeLine()" class="surface-note" x-text="operatorLoadingSafeLine()"></span>
    </div>
