      <div x-show="tab==='today'" data-cc="today-deploy-chrome">
      <template x-if="tab==='today'&&(todayMissionPanel().system_blockers.length||todayMissionPanel().card_gates.length||todayMissionPanel().upgrade_watch.length||todayMissionPanel().avoid_entry.length||todayMissionPanel().quant_cluster_lines.length)">
        <details data-cc="today-mission-panel" style="padding:4px 12px 0">
          <summary class="text-[8px] font-bold uppercase cursor-pointer" style="color:var(--t3);padding:2px 0">System blockers · mission details · expand</summary>
          <div class="card card-p mt-1" style="padding:8px 10px;border-left:3px solid var(--blue)">
            <div class="text-[9px] font-bold uppercase mb-0.5" style="color:var(--t3)" x-text="todayMissionPanelTitle()"></div>
            <div x-show="todayMissionSafeUnlockHint()&&!isWaitDay()" class="text-[8px] mb-1" style="color:var(--t3)" x-text="todayMissionSafeUnlockHint()"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[9px]">
              <div>
                <div class="font-bold text-red-400 mb-0.5" x-text="todayMissionBlockersTitle()"></div>
                <template x-for="b in todayMissionPanel().system_blockers" :key="'sys-'+b">
                  <div class="font-semibold" style="color:var(--amber)" x-text="'• '+b"></div>
                </template>
                <template x-for="b in todayMissionPanel().card_gates" :key="'gate-'+b">
                  <div style="color:var(--t2)" x-text="'• '+b"></div>
                </template>
                <div x-show="!todayMissionPanel().system_blockers.length&&!todayMissionPanel().card_gates.length" style="color:var(--t3)" x-text="todayMissionEmptyBlockersCopy()"></div>
              </div>
              <div>
                <div class="font-bold text-amber-300 mb-0.5" x-text="todayMissionMonitorsLabel()"></div>
                <div class="text-[8px] mb-0.5" style="color:var(--t3)" x-text="todayMissionMonitorsColumnHint()"></div>
                <div x-show="todayMissionPanel().upgrade_watch.length" class="text-[7px] font-bold uppercase mb-0.5" style="color:var(--green)">Upgrade watch · not entry today</div>
                <template x-for="m in todayMissionPanel().upgrade_watch" :key="'up-'+m.ticker">
                  <div style="color:var(--t2)" class="mono" x-text="'• '+m.ticker+(m.note?' · '+m.note:'')"></div>
                </template>
                <div x-show="todayMissionPanel().avoid_entry.length" class="text-[7px] font-bold uppercase mt-1 mb-0.5" style="color:var(--red)">Avoid new entry · still on board</div>
                <template x-for="m in todayMissionPanel().avoid_entry" :key="'av-'+m.ticker">
                  <div style="color:var(--t2)" class="mono" x-text="'• '+m.ticker+(m.note?' · '+m.note:'')"></div>
                </template>
                <div x-show="!todayMissionPanel().upgrade_watch.length&&!todayMissionPanel().avoid_entry.length" style="color:var(--t3)">—</div>
                <template x-if="todayMissionPanel().quant_cluster_lines.length">
                  <div class="font-bold text-blue-300 mt-1 mb-0.5">Quant clusters (monitor)</div>
                  <template x-for="line in todayMissionPanel().quant_cluster_lines" :key="'qc-'+line">
                    <div class="text-[8px]" style="color:var(--t3);line-height:1.4" x-text="'• '+line"></div>
                  </template>
                </template>
              </div>
            </div>
          </div>
        </details>
      </template>

      <template x-if="tab==='today'&&(today7.index_regime_summary||today7.regime_stack_summary||today7.ai_reason_codes?.length)">
        <details data-cc="index-regime-strip" style="padding:4px 12px 0">
          <summary class="text-[8px] font-bold uppercase cursor-pointer" style="color:var(--t3);padding:2px 0">Index / regime stack context · expand</summary>
          <div class="mt-1 space-y-1">
            <template x-if="today7.index_regime_summary">
              <div class="card card-p" style="padding:6px 10px;border-left:3px solid var(--amber)">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="pill text-[7px] pa" x-text="today7.regime_strip?.degraded?'MOCK/DEGRADED':'REGIME FILTER'"></span>
                  <span class="text-[9px] font-bold" style="color:var(--t2)" x-text="today7.regime_strip?.posture_label||today7.index_regime_summary?.posture_label||'Index regime'"></span>
                </div>
                <div class="text-[8px] mt-0.5" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.indexRegimeStripLine)?CCHelpers.indexRegimeStripLine(today7.index_regime_summary,today7.regime_strip):((today7.regime_strip&&today7.regime_strip.line)||today7.index_regime_summary?.strip_line||'')"></div>
              </div>
            </template>
            <template x-if="today7.regime_stack_summary||today7.ai_reason_codes?.length">
              <div data-cc="regime-stack-strip" class="card card-p" style="padding:6px 10px;border-left:3px solid var(--blue)">
                <div class="flex flex-wrap items-center gap-2 mb-0.5">
                  <span class="pill text-[7px] pb">REGIME STACK</span>
                  <span class="pill text-[7px] pw">AI EXPLANATORY</span>
                </div>
                <div x-show="today7.regime_stack_summary" class="text-[8px] mb-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.regimeStackStripLine)?CCHelpers.regimeStackStripLine(today7.regime_stack_summary):''"></div>
                <div x-show="today7.allocator_stance&&today7.allocator_stance.suggestion" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.allocatorStanceHint)?CCHelpers.allocatorStanceHint(today7.allocator_stance):''"></div>
                <div data-cc="ai-reason-codes">
                <template x-if="today7.ai_reason_codes&&today7.ai_reason_codes.length">
                  <template x-for="rc in today7.ai_reason_codes.slice(0,3)" :key="'ai-rc-'+rc.code">
                    <div class="text-[8px]" style="color:var(--t2);line-height:1.4" x-text="'• '+(window.CCHelpers&&CCHelpers.aiReasonCodeLine?CCHelpers.aiReasonCodeLine(rc):rc.message)"></div>
                  </template>
                </template>
                </div>
                <div x-show="today7.execution_analytics" data-cc="exec-analytics-sample" class="text-[8px] mt-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.execAnalyticsSample)?CCHelpers.execAnalyticsSample(today7.execution_analytics):''"></div>
              </div>
            </template>
          </div>
        </details>
      </template>

      <template x-if="tab==='today'&&(today7.cc_os||today7.tracker_wave||today7.safe_automation)">
        <details data-cc="tracker-wave-strip" :open="!isWaitDay()" style="padding:4px 12px 0">
          <summary class="text-[8px] font-bold uppercase cursor-pointer" style="color:var(--t3);padding:2px 0">CC operating system · quant / ops support · expand<span x-show="isWaitDay()" class="text-[7px] font-normal ml-1" style="color:var(--t3)">(collapsed on WAIT)</span></summary>
          <div class="card card-p mt-1" style="padding:6px 10px;border-left:3px solid var(--purple)" data-cc="cc-os-console">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <span class="pill text-[7px] pw font-bold">MONITOR / OPS</span>
              <span class="pill text-[7px] pb">NOT DEPLOY AUTHORITY</span>
              <span class="pill text-[7px] pa" x-show="today7.cc_os&&today7.cc_os.degraded">MOCK/DEGRADED</span>
            </div>
            <div class="text-[8px] mb-1 font-semibold" style="color:var(--t2);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.ccOsOperatorStrip)?CCHelpers.ccOsOperatorStrip(today7.cc_os,today7.tracker_wave):((window.CCHelpers&&CCHelpers.trackerWaveStripLine)?CCHelpers.trackerWaveStripLine(today7.tracker_wave):'')"></div>
            <div x-show="today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.regime_index" data-cc="cc-os-regime-strip" class="text-[8px] mb-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.ccOsRegimeLine)?CCHelpers.ccOsRegimeLine(today7.cc_os.modules.regime_index):''"></div>
            <div x-show="today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.opportunity_quality" data-cc="cc-os-pipeline-strip" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.ccOsPipelineLine)?CCHelpers.ccOsPipelineLine(today7.cc_os.modules.opportunity_quality.pipeline):''"></div>
            <div x-show="today7.drawdown_sizing||today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.capital_control" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.ccOsCapitalLine)?CCHelpers.ccOsCapitalLine(today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.capital_control,today7.drawdown_sizing):((window.CCHelpers&&CCHelpers.drawdownSizingLine)?CCHelpers.drawdownSizingLine(today7.drawdown_sizing):'')"></div>
            <div data-cc="exec-analytics-console" x-show="today7.execution_analytics||today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.execution" class="text-[8px] mb-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.ccOsExecutionLine)?CCHelpers.ccOsExecutionLine(today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.execution,today7.execution_analytics):((window.CCHelpers&&CCHelpers.execAnalyticsConsoleLine)?CCHelpers.execAnalyticsConsoleLine(today7.execution_analytics):'')"></div>
            <div x-show="today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.portfolio_factor" data-cc="cc-os-portfolio-strip" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.ccOsPortfolioLine)?CCHelpers.ccOsPortfolioLine(today7.cc_os.modules.portfolio_factor):''"></div>
            <div x-show="today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.curve_governance" data-cc="cc-os-curve-strip" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.ccOsCurveLine)?CCHelpers.ccOsCurveLine(today7.cc_os.modules.curve_governance):''"></div>
            <div x-show="today7.cc_os&&today7.cc_os.modules&&today7.cc_os.modules.event_intelligence" data-cc="cc-os-event-strip" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.ccOsEventLine)?CCHelpers.ccOsEventLine(today7.cc_os.modules.event_intelligence):''"></div>
            <template x-if="today7.safe_automation&&today7.safe_automation.monitor_upgrade_alerts&&today7.safe_automation.monitor_upgrade_alerts.alerts&&today7.safe_automation.monitor_upgrade_alerts.alerts.length">
              <div data-cc="monitor-upgrade-alerts" class="text-[8px] pt-1 mt-1" style="border-top:1px dashed var(--bd)">
                <div class="font-bold text-amber-300 mb-0.5">Upgrade alerts · not deploy</div>
                <template x-for="a in today7.safe_automation.monitor_upgrade_alerts.alerts.slice(0,2)" :key="'mua-'+a.label">
                  <div class="text-[7px]" style="color:var(--t3)" x-text="'• '+(a.detail||a.label)"></div>
                </template>
              </div>
            </template>
            <div x-show="today7.safe_automation&&today7.safe_automation.research_staleness&&today7.safe_automation.research_staleness.stale" data-cc="research-staleness-alert" class="text-[7px] mb-1" style="color:var(--amber)" x-text="(today7.safe_automation.research_staleness.alerts&&today7.safe_automation.research_staleness.alerts[0])||'Research stale — confirm-only'"></div>
            <template x-if="today7.safe_automation&&today7.safe_automation.daily_briefing">
              <div data-cc="daily-operator-briefing" class="text-[8px] pt-1 mt-1" style="border-top:1px dashed var(--bd);color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.dailyBriefingLine)?CCHelpers.dailyBriefingLine(today7.safe_automation.daily_briefing):''"></div>
            </template>
            <template x-if="today7.safe_automation&&today7.safe_automation.near_miss_recheck&&today7.safe_automation.near_miss_recheck.hints&&today7.safe_automation.near_miss_recheck.hints.length">
              <template x-for="h in today7.safe_automation.near_miss_recheck.hints.slice(0,2)" :key="'recheck-'+h.ticker">
                <div class="text-[7px]" style="color:var(--t3)" x-text="'• '+h.hint"></div>
              </template>
            </template>
            <div x-show="today7.safe_automation&&today7.safe_automation.monitor_queue_aging" class="text-[7px] mt-1" style="color:var(--t3)" x-text="today7.safe_automation.monitor_queue_aging.label||''"></div>
          </div>
        </details>
      </template>

      <!-- ── Ops / IB / Monitor strip (institutional cockpit) ── -->
      <div x-show="tab==='today'" data-cc="deploy-status-strip" style="padding:6px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="pill text-[8px]" :class="ibkrStateFrom(today7.execution_readiness).level==='ready'?'pg':ibkrStateFrom(today7.execution_readiness).level==='blocked'?'pr':'pa'" x-text="'IBKR '+ibkrUnifiedShort(today7.execution_readiness)"></span>

        <template x-if="today7.evidence_badges">
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.regime?.label" x-text="today7.evidence_badges.regime?.badge"></span>
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.funds?.label" x-text="today7.evidence_badges.funds?.badge"></span>
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.ai?.label" x-text="today7.evidence_badges.ai?.badge"></span>
        </template>
        <span x-show="today7.system_truth" class="pill text-[8px] pa" x-text="(typeof CCHelpers!=='undefined'&&CCHelpers.scopedFreshnessStrip)?CCHelpers.scopedFreshnessStrip(today7.system_truth):''"></span>
        <span x-show="!today7.system_truth" class="pill text-[8px] pa" x-text="'Runtime: Unknown · Authority: Blocked'"></span>
        <span x-show="riskAlertsStripVisible()" class="pill text-[8px] pr" x-text="riskAlertsStripLine()" @click="showAlertsModal=true" style="cursor:pointer"></span>
        <span x-show="portfolioSummaryStripVisible()" class="pill text-[8px] pb" x-text="portfolioSummaryStripLine()"></span>

      <div x-show="tab==='today'&&todayOpsRecoveryCompactLine()" class="w-full text-[8px] px-3 pb-1" style="color:var(--t3);line-height:1.45" x-text="todayOpsRecoveryCompactLine()"></div>
      </div>
