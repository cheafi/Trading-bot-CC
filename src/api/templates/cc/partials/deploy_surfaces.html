      <div x-show="tab==='today'" data-cc="today-deploy-chrome">
      <template x-if="tab==='today'&&(todayMissionPanel().system_blockers.length||todayMissionPanel().card_gates.length||todayMissionPanel().monitors.length||todayMissionPanel().quant_cluster_lines.length)">
        <div data-cc="today-mission-panel" style="padding:4px 12px 0">
          <div class="card card-p" style="padding:8px 10px;border-left:3px solid var(--blue)">
            <div class="text-[9px] font-bold uppercase mb-0.5" style="color:var(--t3)" x-text="todayMissionPanelTitle()"></div>
            <div x-show="todayMissionWaitSubtitle()" class="text-[8px] mb-1" style="color:var(--t2)" x-text="todayMissionWaitSubtitle()"></div>
            <div x-show="todayBoardHeroSynthesisLine()" class="text-[8px] mb-1" style="color:var(--t3);line-height:1.45" x-text="todayBoardHeroSynthesisLine()"></div>
            <div x-show="todayMissionSafeUnlockHint()" class="text-[8px] mb-1" style="color:var(--t3)" x-text="todayMissionSafeUnlockHint()"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[9px]">
              <div>
                <div class="font-bold text-red-400 mb-0.5" x-text="todayMissionBlockersTitle()"></div>
                <template x-for="b in todayMissionPanel().system_blockers" :key="'sys-'+b">
                  <div class="font-semibold" style="color:var(--amber)" x-text="'• '+b"></div>
                </template>
                <template x-for="b in todayMissionPanel().card_gates" :key="'gate-'+b">
                  <div style="color:var(--t2)" x-text="'• '+b"></div>
                </template>
                <div x-show="!todayMissionPanel().system_blockers.length&&!todayMissionPanel().card_gates.length" style="color:var(--t3)" x-text="todayMissionEmptyBlockersCopy()"></div>
                <div x-show="todayMissionPanel().system_blockers.length&&!todayMissionPanel().card_gates.length" class="text-[8px] mt-0.5" style="color:var(--t3)" x-text="todayMissionEmptyBlockersCopy()"></div>
              </div>
              <div>
                <div class="font-bold text-amber-300 mb-0.5" x-text="todayMissionMonitorsLabel()"></div>
                <div class="text-[8px] mb-0.5" style="color:var(--t3)" x-text="todayMissionMonitorsColumnHint()"></div>
                <template x-for="m in todayMissionPanel().monitors" :key="'mon-'+m">
                  <div style="color:var(--t2)" class="mono" x-text="'• '+m"></div>
                </template>
                <div x-show="!todayMissionPanel().monitors.length" style="color:var(--t3)">—</div>
                <template x-if="todayMissionPanel().quant_cluster_lines.length">
                  <div class="font-bold text-blue-300 mt-1 mb-0.5">Quant clusters (monitor)</div>
                  <template x-for="line in todayMissionPanel().quant_cluster_lines" :key="'qc-'+line">
                    <div class="text-[8px]" style="color:var(--t3);line-height:1.4" x-text="'• '+line"></div>
                  </template>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template x-if="tab==='today'&&today7.bdr_summary">
        <div data-cc="bdr-summary-panel" style="padding:4px 12px 0">
          <details class="card card-p" style="padding:8px 10px;border-left:3px solid var(--green)" :open="bdrPanelOpen">
            <summary class="flex flex-wrap items-center gap-2 cursor-pointer list-none" @click.prevent="if(!uiExpandAllActive()) bdrPanelOpen=!bdrPanelOpen">
              <span class="text-[9px] font-bold uppercase" style="color:var(--green)">BDR 決策摘要 · Decision brief</span>
              <span class="pill text-[7px]" :class="today7.bdr_summary.decision_code==='DEPLOY'?'pg':(today7.bdr_summary.decision_code==='SELECTIVE'?'pb':'pa')" x-text="today7.bdr_summary.decision_code||'—'"></span>
              <button type="button" class="btn-s text-[8px] ml-auto" @click.stop="copyBdrSummary()">Copy · 複製</button>
            </summary>
            <div class="text-[9px] font-bold mt-2 mb-1" style="color:var(--t2)">
              <span style="color:var(--t3)">決策 · Decision:</span>
              <span x-text="today7.bdr_summary.decision_line"></span>
            </div>
            <div class="text-[8px] font-bold uppercase mb-0.5" style="color:var(--amber)">硬性閘門 · Hard gates blocking</div>
            <template x-for="g in (today7.bdr_summary.hard_gates_blocking||[])" :key="'bdr-g-'+g.n">
              <div class="text-[8px] mb-0.5" style="color:var(--t2);line-height:1.45">
                <span class="font-bold" x-text="g.n+'.'"></span>
                <span x-text="g.label+' — '+g.detail"></span>
              </div>
            </template>
            <div class="text-[8px] font-bold uppercase mt-2 mb-0.5" style="color:var(--t3)">風險回報 · R:R quality (top names)</div>
            <div class="overflow-x-auto">
              <table class="w-full text-[8px]" style="color:var(--t2)">
                <thead>
                  <tr style="color:var(--t3)">
                    <th class="text-left pr-2">Rank</th>
                    <th class="text-left pr-2">Ticker</th>
                    <th class="text-left pr-2">Action</th>
                    <th class="text-left pr-2">R:R</th>
                    <th class="text-left">Main issue</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in (today7.bdr_summary.rr_quality_table||[])" :key="'bdr-rr-'+row.rank+'-'+row.ticker">
                    <tr>
                      <td class="pr-2 mono" x-text="row.rank"></td>
                      <td class="pr-2 mono font-bold" x-text="row.ticker"></td>
                      <td class="pr-2" x-text="row.action"></td>
                      <td class="pr-2 mono" x-text="row.risk_reward"></td>
                      <td x-text="row.main_issue"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="text-[8px] font-bold uppercase mt-2 mb-0.5" style="color:var(--t3)">白話解讀 · Plain-English read</div>
            <div class="text-[8px] mb-1" style="color:var(--t2);line-height:1.45" x-text="today7.bdr_summary.plain_english_read"></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1">
              <div>
                <div class="text-[8px] font-bold uppercase mb-0.5" style="color:var(--blue)">只監察 · Monitor only</div>
                <template x-for="(ln,i) in ((today7.bdr_summary.what_to_do_now||{}).monitor_only||[])" :key="'bdr-mon-'+i">
                  <div class="text-[8px]" style="color:var(--t2)" x-text="'• '+ln"></div>
                </template>
              </div>
              <div>
                <div class="text-[8px] font-bold uppercase mb-0.5" style="color:var(--red)">不可部署 · Do not deploy</div>
                <template x-for="(ln,i) in ((today7.bdr_summary.what_to_do_now||{}).do_not_deploy||[])" :key="'bdr-dnd-'+i">
                  <div class="text-[8px]" style="color:var(--t2)" x-text="'• '+ln"></div>
                </template>
              </div>
            </div>
            <div class="text-[8px] font-bold uppercase mt-2 mb-0.5" style="color:var(--t3)">解鎖清單 · Unlock checklist</div>
            <template x-for="c in (today7.bdr_summary.unlock_checklist||[])" :key="'bdr-u-'+c.key">
              <div class="text-[8px] mb-0.5" style="color:var(--t2)">
                <span x-text="(c.met?'✓':'✗')+' '+c.label+': '+c.current"></span>
                <span style="color:var(--t3)" x-text="' → '+c.target"></span>
              </div>
            </template>
            <div class="text-[8px] font-bold uppercase mt-2 mb-0.5" style="color:var(--green)">一句重點 · Best concise note</div>
            <div class="text-[8px] font-semibold" style="color:var(--t2)" x-text="today7.bdr_summary.best_concise_note"></div>
          </details>
        </div>
      </template>

      <template x-if="tab==='today'&&today7.index_regime_summary">
        <div data-cc="index-regime-strip" style="padding:4px 12px 0">
          <div class="card card-p" style="padding:6px 10px;border-left:3px solid var(--amber)">
            <div class="flex flex-wrap items-center gap-2">
              <span class="pill text-[7px] pa" x-text="today7.regime_strip?.degraded?'MOCK/DEGRADED':'REGIME FILTER'"></span>
              <span class="text-[9px] font-bold" style="color:var(--t2)" x-text="today7.regime_strip?.posture_label||today7.index_regime_summary?.posture_label||'Index regime'"></span>
            </div>
            <div class="text-[8px] mt-0.5" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.indexRegimeStripLine)?CCHelpers.indexRegimeStripLine(today7.index_regime_summary,today7.regime_strip):((today7.regime_strip&&today7.regime_strip.line)||today7.index_regime_summary?.strip_line||'')"></div>
          </div>
        </div>
      </template>

      <template x-if="tab==='today'&&(today7.regime_stack_summary||today7.ai_reason_codes?.length)">
        <div data-cc="regime-stack-strip" style="padding:4px 12px 0">
          <div class="card card-p" style="padding:6px 10px;border-left:3px solid var(--blue)">
            <div class="flex flex-wrap items-center gap-2 mb-0.5">
              <span class="pill text-[7px] pb">REGIME STACK</span>
              <span class="pill text-[7px] pw">AI EXPLANATORY</span>
            </div>
            <div x-show="today7.regime_stack_summary" class="text-[8px] mb-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.regimeStackStripLine)?CCHelpers.regimeStackStripLine(today7.regime_stack_summary):''"></div>
            <div x-show="today7.allocator_stance&&today7.allocator_stance.suggestion" class="text-[8px] mb-1" style="color:var(--t3)" x-text="(window.CCHelpers&&CCHelpers.allocatorStanceHint)?CCHelpers.allocatorStanceHint(today7.allocator_stance):''"></div>
            <div data-cc="ai-reason-codes">
            <template x-if="today7.ai_reason_codes&&today7.ai_reason_codes.length">
              <template x-for="rc in today7.ai_reason_codes.slice(0,3)" :key="'ai-rc-'+rc.code">
                <div class="text-[8px]" style="color:var(--t2);line-height:1.4" x-text="'• '+(window.CCHelpers&&CCHelpers.aiReasonCodeLine?CCHelpers.aiReasonCodeLine(rc):rc.message)"></div>
              </template>
            </template>
            </div>
            <div x-show="today7.execution_analytics" data-cc="exec-analytics-sample" class="text-[8px] mt-1" style="color:var(--t3);line-height:1.45" x-text="(window.CCHelpers&&CCHelpers.execAnalyticsSample)?CCHelpers.execAnalyticsSample(today7.execution_analytics):''"></div>
          </div>
        </div>
      </template>

      <!-- ── Ops / IB / Monitor strip (institutional cockpit) ── -->
      <div x-show="tab==='today'" data-cc="deploy-status-strip" style="padding:6px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="pill text-[8px]" :class="ibkrStateFrom(today7.execution_readiness).level==='ready'?'pg':ibkrStateFrom(today7.execution_readiness).level==='blocked'?'pr':'pa'" x-text="'IBKR '+ibkrUnifiedShort(today7.execution_readiness)"></span>
        <span class="pill text-[8px]" :class="cc_status.breaker?'pr':(ops.running?'pg':'pw')" x-text="cc_status.breaker?'BREAKER':(ops.running?'ENGINE ON':'ENGINE OFF')"></span>
        <template x-if="today7.evidence_badges">
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.regime?.label" x-text="today7.evidence_badges.regime?.badge"></span>
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.funds?.label" x-text="today7.evidence_badges.funds?.badge"></span>
          <span class="pill text-[7px] pw" :title="today7.evidence_badges.ai?.label" x-text="today7.evidence_badges.ai?.badge"></span>
        </template>
        <span x-show="freshness&&freshness.worst_tier" class="pill text-[8px]" :class="['STALE','CRITICAL'].includes(freshness.worst_tier)?'pa':'pg'" x-text="'DATA '+freshness.worst_tier"></span>
        <span x-show="riskAlertsStripVisible()" class="pill text-[8px] pr" x-text="riskAlertsStripLine()" @click="showAlertsModal=true" style="cursor:pointer"></span>
        <span x-show="portfolioSummaryStripVisible()" class="pill text-[8px] pb" x-text="portfolioSummaryStripLine()"></span>
        <button @click="switchTab('funds')" class="btn-s text-[8px] ml-auto" x-show="(pmStrip.funds||[]).length===0">Load Funds</button>
      </div>
      <div x-show="tab==='today'&&!ops.running" class="w-full text-[8px] px-3 pb-1" style="color:var(--t3)" x-text="engineOffRecoveryLine()"></div>
      <div x-show="tab==='today'&&ibkrStateFrom(today7.execution_readiness).level!=='ready'" class="w-full text-[8px] px-3 pb-1" style="color:var(--t3)" x-text="ibkrLoginToReadyHint()"></div>
      <div x-show="tab==='today'&&todayExecutionReadinessDiagnostic()" class="w-full text-[8px] px-3 pb-1 mono" style="color:var(--t3)" x-text="todayExecutionReadinessDiagnostic()"></div>
      </div>
